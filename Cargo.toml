[package]
name = "openshell-desktop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "GNOME desktop manager for NVIDIA OpenShell sandboxes on LXD / MicroCloud"
repository = "https://github.com/kenvandine/openshell-desktop"

[workspace]
members = ["crates/openshell-agents", "crates/openshell-lxd", "crates/openshell-driver-lxd", "crates/openshell-gateway-client"]

[dependencies]
# Feature floors match Ubuntu 24.04 / core24 (GTK 4.14, libadwaita 1.5).
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
async-channel = "2"
openshell-agents = { path = "crates/openshell-agents" }
openshell-gateway-client = { path = "crates/openshell-gateway-client" }
openshell-lxd = { path = "crates/openshell-lxd" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
pangocairo = "0.22"
ksni = { version = "0.3.7", features = ["blocking"] }

[build-dependencies]
bindgen = "0.73"
pkg-config = "0.3"

[package]
name = "openshell-desktop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "GNOME desktop manager for NVIDIA OpenShell sandboxes on LXD / MicroCloud"
repository = "https://github.com/kenvandine/openshell-desktop"

[dependencies]
# gnome_46 matches Ubuntu 24.04 / core24 (GTK 4.14, libadwaita 1.5).
relm4 = { version = "0.11", features = ["libadwaita", "gnome_46"] }

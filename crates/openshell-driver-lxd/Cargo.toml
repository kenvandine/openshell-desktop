[package]
name = "openshell-driver-lxd"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Out-of-tree OpenShell compute driver that runs sandboxes as LXD instances"

[[bin]]
name = "openshell-driver-lxd"
path = "src/main.rs"

[dependencies]
bytes = "1"
# The driver speaks OpenShell's own protos and types, pinned to one commit so
# the wire contract cannot drift from what the gateway was built against.
openshell-core = { git = "https://github.com/NVIDIA/OpenShell", rev = "39d95b42cb403d883e2f545a3861131ccd3d2ebf", default-features = false, features = ["driver-extraction", "jwt"] }
openshell-isolation-interface = { git = "https://github.com/NVIDIA/OpenShell", rev = "39d95b42cb403d883e2f545a3861131ccd3d2ebf" }
openshell-sandbox-backend = { git = "https://github.com/NVIDIA/OpenShell", rev = "39d95b42cb403d883e2f545a3861131ccd3d2ebf" }
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
futures = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
oci-client = { version = "0.18", default-features = false, features = ["rustls-tls"] }
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7", features = ["io"] }
tonic = { version = "0.14", features = ["transport"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = "0.5"
hyper = { version = "1", features = ["client", "server", "http1"] }

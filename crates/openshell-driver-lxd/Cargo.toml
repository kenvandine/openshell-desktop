[package]
name = "openshell-driver-lxd"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Out-of-tree OpenShell compute driver that runs sandboxes as LXD instances"

[[bin]]
name = "openshell-driver-lxd"
path = "src/main.rs"

[dependencies]
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
futures = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
oci-client = { version = "0.18", default-features = false, features = ["rustls-tls"] }
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tokio-util = { version = "0.7", features = ["io"] }
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
protox = "0.9"
tonic-prost-build = "0.14"

[dev-dependencies]
tower = "0.5"
hyper = { version = "1", features = ["client", "server", "http1"] }

[package]
name = "openshell-gateway-client"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Client for the OpenShell gateway API used by openshell-desktop"

[dependencies]
# Same pinned revision as the LXD driver and the bundled gateway.
openshell-core = { git = "https://github.com/NVIDIA/OpenShell", rev = "39d95b42cb403d883e2f545a3861131ccd3d2ebf", default-features = false }
openshell-providers = { git = "https://github.com/NVIDIA/OpenShell", rev = "39d95b42cb403d883e2f545a3861131ccd3d2ebf" }
prost-types = "0.14"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["transport", "tls-aws-lc"] }

[package]
name = "openshell-lxd"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Small LXD REST client over the local Unix socket, including interactive exec"

[dependencies]
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[dev-dependencies]
tempfile = "3"

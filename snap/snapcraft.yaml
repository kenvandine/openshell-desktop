name: openshell-desktop
title: OpenShell Desktop
summary: GNOME manager for NVIDIA OpenShell agent sandboxes on LXD
description: |
  OpenShell Desktop configures, launches and monitors NVIDIA OpenShell agent
  sandboxes running in local LXD containers or on a MicroCloud cluster.

  The snap ships the desktop app, an OpenShell gateway, and
  `openshell-driver-lxd`, the compute driver that runs sandboxes as LXD
  containers. Connect the `lxd` interface, then enable the per-user services
  (the gateway listens on 127.0.0.1:17671, next to the OpenShell snap's
  17670, so enable it for one user only):

    sudo snap connect openshell-desktop:lxd lxd:lxd
    systemctl --user enable --now snap.openshell-desktop.lxd-driver.service \
      snap.openshell-desktop.gateway.service
# Kept equal to Cargo.toml's version. A static version avoids `craftctl`
# version scriptlets, which collide with snapcraft's own git handling.
version: '0.1.0'
license: Apache-2.0
base: core24
grade: devel
confinement: strict
platforms:
  amd64:
  arm64:

environment:
  # Where the bundled gateway writes its client certificates; the app reads
  # the same directory.
  OPENSHELL_LOCAL_TLS_DIR: $SNAP_USER_COMMON/gateway/tls

slots:
  # GApplication owns its application ID on the session bus; strict snaps
  # may only own names they declare.
  dbus-openshell-desktop:
    interface: dbus
    bus: session
    name: io.github.kenvandine.OpenShellDesktop

apps:
  openshell-desktop:
    command: bin/openshell-desktop
    desktop: usr/share/applications/io.github.kenvandine.OpenShellDesktop.desktop
    common-id: io.github.kenvandine.OpenShellDesktop
    extensions: [gnome]
    environment:
      # libghostty-vt is a private shared library in $SNAP/lib.
      LD_LIBRARY_PATH: $SNAP/lib:${LD_LIBRARY_PATH}
    plugs:
      - lxd
      - network
      # The top bar indicator: unity7 lets a strict snap register a
      # StatusNotifierItem and serve its menu over D-Bus.
      - unity7
    slots:
      - dbus-openshell-desktop

  # The gateway and driver run as the logged-in user: the app reads the
  # gateway's TLS bundle from $SNAP_USER_COMMON, and the driver talks to the
  # user's LXD socket. They stay disabled until enabled for one user, since
  # every gateway binds the same loopback port:
  #
  #   systemctl --user enable --now snap.openshell-desktop.lxd-driver.service \
  #     snap.openshell-desktop.gateway.service
  gateway:
    command: bin/gateway-wrapper
    daemon: simple
    daemon-scope: user
    install-mode: disable
    # Do not restart on refresh: that would kill running sandbox sessions.
    refresh-mode: endure
    restart-condition: on-failure
    plugs:
      - network
      - network-bind

  lxd-driver:
    command: bin/lxd-driver-wrapper
    daemon: simple
    daemon-scope: user
    install-mode: disable
    refresh-mode: endure
    restart-condition: on-failure
    plugs:
      - lxd
      - network
      # listen() on the driver's Unix socket for the gateway.
      - network-bind

parts:
  libghostty-vt:
    plugin: nil
    # Only the build script, so edits elsewhere never rebuild Ghostty.
    source: scripts
    source-type: local
    build-packages:
      - curl
      - git
      - xz-utils
    override-build: |
      # libghostty-vt is built with Zig, pinned like CI and the dev script.
      ZIG_VERSION=0.17.0
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64) zig_arch=x86_64 ;;
        arm64) zig_arch=aarch64 ;;
        *) echo "unsupported architecture $CRAFT_ARCH_BUILD_FOR" >&2; exit 1 ;;
      esac
      mkdir -p "$CRAFT_PART_BUILD/zig"
      curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/zig-$zig_arch-linux-$ZIG_VERSION.tar.xz" \
        | tar -xJ --strip-components=1 -C "$CRAFT_PART_BUILD/zig"
      export PATH="$CRAFT_PART_BUILD/zig:$PATH"
      # Zig cannot parse the build instance's resolv.conf; give it a clean one.
      ZIG_CLEAN_RESOLV_CONF=1 ./build-libghostty-vt.sh "$CRAFT_PART_INSTALL"
    # Headers and the .pc file are only needed to build the app.
    prime:
      - lib/libghostty-vt*.so*

  # The OpenShell gateway lives in its own part, with no source, so editing
  # this repository never rebuilds it; it is rebuilt only when this part
  # changes. It is pinned to the revision the driver builds against, without
  # the in-tree Docker/Podman/Kubernetes drivers: sandboxes here are LXD
  # instances behind openshell-driver-lxd.
  openshell-gateway:
    plugin: nil
    build-packages:
      - cmake
      - curl
      - git
      - libclang-dev
      # The gateway links its policy prover against the system libz3.
      - libz3-dev
      - pkg-config
    stage-packages:
      - libz3-4
    build-environment:
      - RUSTUP_HOME: $CRAFT_PART_BUILD/.rustup
      - CARGO_HOME: $CRAFT_PART_BUILD/.cargo
      - CARGO_TARGET_DIR: $CRAFT_PART_BUILD/target
    override-build: |
      if [ ! -x "$CARGO_HOME/bin/cargo" ]; then
        curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
          | sh -s -- -y --no-modify-path --profile minimal --default-toolchain stable
      fi
      export PATH="$CARGO_HOME/bin:$PATH"
      cargo install --git https://github.com/NVIDIA/OpenShell \
        --rev 39d95b42cb403d883e2f545a3861131ccd3d2ebf --locked \
        --no-default-features --root "$CRAFT_PART_INSTALL" openshell-gateway

  openshell-desktop:
    after: [libghostty-vt]
    # Built with a rustup toolchain rather than the rust plugin: the code
    # needs edition 2024 (newer than core24's rustc), and the rust plugin's
    # rustup check does not see the rustup snap under the GNOME extension.
    plugin: nil
    source: .
    build-packages:
      - cmake
      - curl
      - libclang-dev
      - pkg-config
    build-environment:
      - PKG_CONFIG_PATH: $CRAFT_STAGE/share/pkgconfig:${PKG_CONFIG_PATH:-}
      - LIBRARY_PATH: $CRAFT_STAGE/lib:${LIBRARY_PATH:-}
      - RUSTUP_HOME: $CRAFT_PART_BUILD/.rustup
      - CARGO_HOME: $CRAFT_PART_BUILD/.cargo
    override-build: |
      # The toolchain and cargo's target directory live in the part's build
      # directory, which snapcraft keeps when only the sources change.
      if [ ! -x "$CARGO_HOME/bin/cargo" ]; then
        curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
          | sh -s -- -y --no-modify-path --profile minimal --default-toolchain stable
      fi
      export PATH="$CARGO_HOME/bin:$PATH"
      cargo build --release --locked --workspace --bins
      install -Dm755 snap/local/gateway-wrapper "$CRAFT_PART_INSTALL/bin/gateway-wrapper"
      install -Dm755 target/release/openshell-desktop "$CRAFT_PART_INSTALL/bin/openshell-desktop"
      install -Dm755 target/release/openshell-driver-lxd "$CRAFT_PART_INSTALL/bin/openshell-driver-lxd"
      install -Dm755 snap/local/lxd-driver-wrapper "$CRAFT_PART_INSTALL/bin/lxd-driver-wrapper"
      install -Dm644 data/io.github.kenvandine.OpenShellDesktop.desktop \
        "$CRAFT_PART_INSTALL/usr/share/applications/io.github.kenvandine.OpenShellDesktop.desktop"
      install -Dm644 data/icons/io.github.kenvandine.OpenShellDesktop.svg \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/io.github.kenvandine.OpenShellDesktop.svg"
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/scalable/apps/io.github.kenvandine.OpenShellDesktop.svg|' \
        "$CRAFT_PART_INSTALL/usr/share/applications/io.github.kenvandine.OpenShellDesktop.desktop"
